<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Language to Bash</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 500px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
        }
        #response {
            margin-top: 20px;
            white-space: pre-wrap;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Natural Language to Bash</h1>
        <textarea id="query" placeholder="Enter your natural language query here..."></textarea>
        <button onclick="translate()">Translate</button>
        <div id="response"></div>
    </div>

    <script>
        async function translate() {
            const query = document.getElementById('query').value;
            const responseContainer = document.getElementById('response');
            responseContainer.textContent = 'Translating...';

            const response = await fetch('/translate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query })
            });

            const data = await response.json();

            if (data.error) {
                responseContainer.textContent = `Error: ${data.error}`;
            } else {
                responseContainer.textContent = data.bash_command;
            }
        }
    </script>
</body>
</html>
